[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "soteria"
version = "1.0.0"
description = "Automated Adversarial Red-Teaming Harness for AI Applications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Soteria Team" }]
keywords = ["red-teaming", "llm-security", "adversarial-testing", "owasp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.5.0",
    "rapidfuzz>=3.6.0",
    "aiosqlite>=0.20.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3.0", "mypy>=1.8"]

[project.scripts]
soteria = "cli:main"

[project.entry-points.pytest11]
soteria = "plugins.pytest_soteria"

[tool.setuptools.packages.find]
include = ["core*", "mutators*", "evaluators*", "reports*", "plugins*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
